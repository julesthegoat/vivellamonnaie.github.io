  <circle cx="360" cy="370" r="49" fill="#141416"/>
  <path d="M299 390c25 15 98 15 122 0" fill="none" stroke="#d49b4f" stroke-width="3" opacity=".8"/>
  <path d="M0 720h720v240H0z" fill="#111311" opacity=".92"/>
  <text x="52" y="770" fill="#e6aa50" font-family="Arial,sans-serif" font-size="17" letter-spacing="6">INSPIRATION RAP · VISUEL FICTIF</text>
  <text x="48" y="856" fill="#f2eee5" font-family="Georgia,serif" font-size="74" font-weight="bold">MC PAO</text>
