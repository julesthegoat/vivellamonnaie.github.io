<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Affiche fictive inspirée de la chanson française — Renaud</title>
  <desc id="desc">Composition graphique originale avec une silhouette anonyme de musicien, une guitare et une bouteille stylisée. Ce visuel ne représente pas Renaud et ne suggère aucune association officielle.</desc>
