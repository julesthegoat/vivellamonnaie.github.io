<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Affiche fictive inspirée de l’énergie du rap — MC Pao</title>
  <desc id="desc">Composition graphique originale avec une silhouette anonyme de scène, des ondes sonores et une bouteille stylisée. Ce visuel ne représente pas MC Pao et ne suggère aucune association officielle.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18121d"/><stop offset=".55" stop-color="#40202b"/><stop offset="1" stop-color="#bd552d"/></linearGradient>
    <linearGradient id="beam" x2="0" y2="1"><stop stop-color="#f3bb62" stop-opacity=".8"/><stop offset="1" stop-color="#f3bb62" stop-opacity="0"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="0"><stop stop-color="#6c3218"/><stop offset=".45" stop-color="#bd6b2b"/><stop offset="1" stop-color="#592815"/></linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#fff" opacity=".14"/></pattern>
  </defs>
  <rect width="720" height="960" fill="url(#bg)"/>
  <path d="M80 0h145l230 690H340zM510 0h80L390 690h-72z" fill="url(#beam)" opacity=".48"/>
  <circle cx="360" cy="375" r="190" fill="none" stroke="#e6a848" stroke-opacity=".36" stroke-width="2"/>
  <circle cx="360" cy="375" r="150" fill="none" stroke="#e6a848" stroke-opacity=".22" stroke-width="2"/>
  <g fill="none" stroke="#f1bd69" stroke-width="5" opacity=".8"><path d="M65 395v-45m22 75V320m22 132V285m22 162v-92m22 70v-51m358 21v-55m22 90V310m22 116v-77m22 48v-32m22 18v-8"/></g>
