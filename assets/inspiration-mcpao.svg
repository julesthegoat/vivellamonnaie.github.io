    <rect x="8" y="75" width="68" height="67" rx="3" fill="#d5bf79"/>
    <text x="42" y="97" text-anchor="middle" fill="#20351d" font-family="Arial,sans-serif" font-size="7" font-weight="bold">JÄGERMEISTER</text>
